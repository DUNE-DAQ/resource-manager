[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "D",    # pydocstyle
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "RUF",  # ruff
]
pydocstyle.convention = "google"

[tool.djlint]
profile = "django"
indent = 2

[tool.django-stubs]
django_settings_module = "resource_manager.settings"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.pytest.ini_options]
addopts = "-v --mypy --cov=. --cov-report=html"
DJANGO_SETTINGS_MODULE = "resource_manager.settings"
FAIL_INVALID_TEMPLATE_VARS = true

[tool.coverage.run]
omit = ["manage.py", "resource_manager/*", "tests/*"]
